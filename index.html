<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <title>SMP Al-Madinah</title>
  </head>
  <body>
    <script>
      // Terapkan warna tema tersimpan SEBELUM React mount, supaya tidak ada
      // kedip warna default saat refresh (lihat src/client/lib/theme.ts).
      (function () {
        try {
          var hex = localStorage.getItem("smpam:theme-color");
          if (hex && /^#[0-9a-f]{6}$/i.test(hex)) {
            document.documentElement.style.setProperty("--primary", hex);
            document.documentElement.style.setProperty("--ring", hex);
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
