name: Backup Database Mingguan

# Jadwal: setiap Minggu 01:00 WIB = Sabtu 18:00 UTC.
# Bisa juga dijalankan manual lewat tab "Actions" di GitHub (workflow_dispatch).
on:
  schedule:
    - cron: "0 18 * * 6"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Tentukan nama file backup
        id: filename
        run: echo "name=smpam-$(date -u +%Y-%m-%d).sql" >> "$GITHUB_OUTPUT"

      - name: Export database D1 (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 export smpam-db --remote --output="${{ steps.filename.outputs.name }}"

      - name: Unggah ke R2 (prefix backup/)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler r2 object put "smpam-files/backup/${{ steps.filename.outputs.name }}" \
            --file="${{ steps.filename.outputs.name }}" \
            --remote
