name = "smp-al-madinah"
main = "src/server/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "smpam-db"
database_id = "2ca6ae32-f89f-4779-a46a-1c7c1c07ffb8"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "smpam-files"

[triggers]
crons = ["0 18 * * *"]

[vars]
# Nilai di bawah ini adalah yang ikut ter-deploy ke production.
# Untuk dev lokal, nilai ini DIOVERRIDE oleh file .dev.vars (lihat .dev.vars.example)
# yang otomatis dibaca oleh `vite dev` — jadi tidak perlu [env.xxx] terpisah.
ENVIRONMENT = "production"
SESSION_COOKIE_NAME = "smpam_session"
PASSWORD_PBKDF2_ITERATIONS = "5000"
ACTIVITY_LOG_RETENTION_DAYS = "180"

[observability]
enabled = true

# --- Setup production ---
# Jalankan `wrangler d1 create smpam-db` dan `wrangler r2 bucket create smpam-files`
# lalu ganti database_id di atas dengan id yang diberikan. Lihat README.
